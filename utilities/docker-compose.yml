version: "3.4"

services:

  prometheus:
    container_name: prometheus-service
    build:
      context: prometheus
    cpus: 0.1
    mem_limit: 100m
    # volumes:
    #   - ./prometheus:/etc/prometheus
    ports:
      - 9090:9090
    restart: always
    networks:
      - llm-net
    volumes:
      - prometheus_data:/data/prometheus

  tempo:
    container_name: tempo-service
    build:
      context: tempo
    cpus: 0.1
    mem_limit: 100m
    ports:
      - 3200:3200   #tempo api
    restart: always
    networks:
      - llm-net
    volumes:
      - tempo_data:/tmp/tempo
  
  grafana:
    container_name: grafana
    build:
      context: grafana
    cpus: 0.3
    mem_limit: 500m
    ports:
      - 3000:3000
    restart: always
    networks:
      - llm-net
    volumes:
      - grafana_data:/var/lib/grafana
  
  loki:
    container_name: loki-service
    build:
      context: loki
    cpus: 0.1
    mem_limit: 100m
    ports:
      - 3100:3100   #otlp http
      - 9095:9095   #otlp grpc
    restart: always
    networks:
      - llm-net

  otelcollector:
    container_name: otelcollector-service
    cpus: 0.1
    mem_limit: 100m
    build:
      context: otelcollector
    ports:
      - 8888:8888   # Prometheus metrics exposed by the Collector
      - 8889:8889   # Prometheus exporter metrics
      - 13133:13133 # health_check extension (/health/status)
    restart: always
    networks:
      - llm-net

  # ollama:
  #   container_name: ollama
  #   build:
  #     context: ollama
  #   ports:
  #     - 11434:11434   # Ollama API
  #   networks:
  #     - llm-net

  qdrant:
    container_name: qdrant-service
    build:
      context: qdrant
    ports:
      - 6333:6333 # Qdrant Web
      - 6334:6334 # Qdrant GRPC
    networks:
      - llm-net
    volumes:
      - qdrant_data:/qdrant/storage
  
  # sonarqube:
  #   container_name: sonarqube-service
  #   build:
  #     context: sonarqube
  #   ports:
  #     - "9000:9000"
  #   networks:
  #     - llm-net
  #   volumes:
  #     - sonarqube_data:/opt/sonarqube/data
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1'
  #         memory: 1.2G

  mongodb:
    container_name: mongodb-service
    build:
      context: mongodb
    ports:
      - "27018:27017"
    networks:
      - llm-net
    volumes:
      - mongodb_data:/data/db
  
  mongodb-search:
    container_name: mongod
    build:
      context: mongodb-search
    ports:
      - "27017:27017"
    networks:
      - llm-net
    volumes:
      - mongodb_data_search:/data/db

  rabbitmq:
    container_name: rabbitmq-service
    build:
      context: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - llm-net

  memcached:
    container_name: memcached-service
    build:
      context: memcached
    ports:
      - "11211:11211"
    networks:
      - llm-net

  keycloak:
    container_name: keycloak-service
    build:
      context: keycloak
    command:
      [ "start-dev"]
    ports:
      - "8080:8080"
    networks:
      - llm-net
    volumes:
      - keycloak_data:/opt/keycloak/data/

  postgres:
    container_name: postgres-service
    build:
      context: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - llm-net

networks:
  llm-net:
    external: true
volumes:
  sonarqube_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
  mongodb_data:
  mongodb_data_search:
  keycloak_data: